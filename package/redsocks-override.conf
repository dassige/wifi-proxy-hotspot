[Unit]
# The vendor unit only orders after network.target, which fires once the
# networking stack is initialized -- it does NOT guarantee an interface has
# an address or that DNS actually resolves yet. A hostname-based proxy
# profile (any redsocks{} block using a hostname instead of a literal IP)
# is resolved once at redsocks' own startup; if DNS isn't ready yet at that
# exact moment, redsocks exits with a fatal config-parse error and, being a
# plain Type=forking unit with no Restart= policy, stays dead until someone
# notices and restarts it by hand -- confirmed real incident 2026-09-30,
# down for 4.5 hours undetected. network-online.target is a real, if
# imperfect, improvement on network.target for this.
After=network-online.target
Wants=network-online.target

[Service]
# Belt-and-suspenders beyond better ordering: if redsocks still ever fails
# for any reason (DNS blip, anything else), retry automatically rather than
# staying dead indefinitely.
Restart=on-failure
RestartSec=5
# rasp-proxy-firewall-init.service Requires= redsocks.service, so if redsocks
# wasn't up yet when firewall-init tried to run at boot, firewall-init's start
# job failed with result 'dependency' and -- being a oneshot -- never retries
# on its own even once redsocks recovers.
#
# Test is-active, NOT is-failed: a dependency-failed oneshot is left
# "inactive", not "failed", so an is-failed test never fires (incident
# 2026-11-18: power outage, DNS not up at boot, firewall missing until
# rebuilt by hand). Once firewall-init has run it stays active
# (RemainAfterExit=yes), so this line does nothing on later redsocks
# restarts. (Those still re-run firewall-init, but through its
# Requires=redsocks: systemd passes a restart on to units that require it.
# That's harmless, since the rebuild starts from scratch every time.)
# --no-block is required: firewall-init is ordered After=redsocks, so a
# blocking start from redsocks' own ExecStartPost would deadlock. On a normal
# boot the start job is already queued and this merges into it (one run).
ExecStartPost=/bin/sh -c 'systemctl is-active --quiet rasp-proxy-firewall-init.service || systemctl start --no-block rasp-proxy-firewall-init.service || true'
