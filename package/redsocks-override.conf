[Unit]
# The vendor unit only orders after network.target, which fires once the
# networking stack is initialized -- it does NOT guarantee an interface has
# an address or that DNS actually resolves yet. A hostname-based proxy
# profile (any redsocks{} block using a hostname instead of a literal IP)
# is resolved once at redsocks' own startup; if DNS isn't ready yet at that
# exact moment, redsocks exits with a fatal config-parse error and, being a
# plain Type=forking unit with no Restart= policy, stays dead until someone
# notices and restarts it by hand -- confirmed real incident 2026-09-30,
# down for 4.5 hours undetected. network-online.target is a real, if
# imperfect, improvement on network.target for this.
After=network-online.target
Wants=network-online.target

[Service]
# Belt-and-suspenders beyond better ordering: if redsocks still ever fails
# for any reason (DNS blip, anything else), retry automatically rather than
# staying dead indefinitely.
Restart=on-failure
RestartSec=5
# rasp-proxy-firewall-init.service Requires= redsocks.service, so if redsocks
# wasn't up yet when firewall-init tried to run at boot, firewall-init also
# failed and -- being a oneshot -- never retries on its own even once
# redsocks recovers. Only re-trigger it if it's actually in a failed state,
# so a normal first boot (where firewall-init's own After=/Requires= on
# redsocks already handles ordering correctly) doesn't run the rebuild
# twice.
ExecStartPost=/bin/sh -c 'systemctl is-failed --quiet rasp-proxy-firewall-init.service && systemctl restart rasp-proxy-firewall-init.service || true'
